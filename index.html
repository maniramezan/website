    <meta name="theme-color" content="#f6f1ec" />
    <script>
      // Apply the saved (or system) theme before first paint so dark-mode visitors
      // never see a light flash. Keep the key and colours in sync with App.jsx.
      (function () {
        try {
          var saved = localStorage.getItem("mani-theme");
          var theme = saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')
            .setAttribute("content", theme === "dark" ? "#1c1719" : "#f6f1ec");
        } catch (e) {}
      })();
    </script>
