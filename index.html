<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f2" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("mani-theme");
          var theme = saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')
            .setAttribute("content", theme === "dark" ? "#1b1e1b" : "#f7f7f2");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap"
      rel="stylesheet"
    />

    <!-- Everything between the page-meta markers (including JSON-LD) is rewritten per
         route by scripts/prerender.mjs from src/seo.js; these are the home values for dev. -->

    <title>Mani Ramezan — Founder, Arjang Consulting</title>

    <link rel="canonical" href="https://maniramezan.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mani Ramezan — Founder, Arjang Consulting" />
    <meta property="og:description" content="Mani Ramezan — staff-level iOS engineer, founder of Arjang Consulting, and mobile tech lead at Capital One. Writing on native mobile architecture, performance, and developer tooling." />
    <meta property="og:url" content="https://maniramezan.com/" />
    <meta name="twitter:title" content="Mani Ramezan — Founder, Arjang Consulting" />
    <meta name="twitter:description" content="Mani Ramezan — staff-level iOS engineer, founder of Arjang Consulting, and mobile tech lead at Capital One. Writing on native mobile architecture, performance, and developer tooling." />
    <!-- page-meta:end -->

    <meta property="og:site_name" content="Mani Ramezan" />
